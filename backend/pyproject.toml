[project]
name = "evidencia"
version = "0.1.0"
description = "Hybrid retrieval with verified citations — canonical Python implementation"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evidencia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
